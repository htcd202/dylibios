name: Build iOS Mod Menu

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Theos and iOS SDK
      run: |
        echo "=== Installing Theos ==="
        export THEOS=~/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        
        echo "=== Linking Official Xcode iPhoneOS SDK ==="
        SYS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "Found System SDK: $SYS_SDK"
        ln -s "$SYS_SDK" $THEOS/sdks/iPhoneOS.sdk
        
        echo "=== Downloading Patched iOS SDKs ==="
        git clone --depth=1 https://github.com/theos/sdks.git ~/theos-sdks || true
        for sdk in ~/theos-sdks/iPhoneOS*.sdk; do
          if [ -d "$sdk" ]; then
            cp -R "$sdk" $THEOS/sdks/ 2>/dev/null || true
          fi
        done

    - name: Compile and Package Mod Menu
      run: |
        export THEOS=~/theos
        make clean
        make package FINALPACKAGE=1

    - name: Upload .deb and .dylib Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Kritika_v5.30.2_ModMenu
        path: |
          packages/*.deb
          .theos/obj/debug/*.dylib
