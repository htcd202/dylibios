name: Build iOS Mod Menu

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-13

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Theos and ldid
      run: |
        echo "=== Installing ldid ==="
        brew install ldid
        
        echo "=== Installing Theos ==="
        export THEOS=~/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        
        echo "=== Linking Xcode SDK ==="
        SYS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        ln -s "$SYS_SDK" $THEOS/sdks/iPhoneOS.sdk

    - name: Compile and Package Mod Menu
      run: |
        export THEOS=~/theos
        make clean
        make package FINALPACKAGE=1

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Kritika_v5.30.2_ModMenu_macOS
        path: |
          packages/*.deb
          .theos/obj/*.dylib
          .theos/obj/debug/*.dylib

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Linux Theos and Clang
      run: |
        sudo apt-get update
        sudo apt-get install -y clang make git ldid
        export THEOS=~/theos
        git clone --recursive https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        
        echo "=== Installing iOS SDK ==="
        git clone --depth=1 https://github.com/theos/sdks.git ~/theos-sdks
        cp -r ~/theos-sdks/iPhoneOS16.5.sdk $THEOS/sdks/ || cp -r ~/theos-sdks/iPhoneOS*.sdk $THEOS/sdks/ || true

    - name: Compile on Linux
      run: |
        export THEOS=~/theos
        make clean
        make package FINALPACKAGE=1 || true

    - name: Upload Linux Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Kritika_v5.30.2_ModMenu_Linux
        path: |
          packages/*.deb
          .theos/obj/*.dylib
          .theos/obj/debug/*.dylib
      continue-on-error: true
